[project]
name = "kaggle-happywhale-1st-place"
version = "0.1.0"
description = "knshnb's part of the 1st place solution of Kaggle Happywhale"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  "albumentations>=2.0.8",
  "lightning>=2.6",
  "numpy>=2.3",
  "opencv-python-headless>=4.12",
  "optuna>=5",
  "optuna-integration>=5",
  "pandas>=3",
  "pyyaml>=6",
  "scikit-learn>=1.8",
  "scipy>=1.16",
  "timm>=1.0.20",
  "torch>=2.9",
  "wandb>=0.22",
]

[dependency-groups]
dev = [
  "ruff>=0.16,<0.17",
  "ty>=0.0.73,<0.1",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120

[tool.ruff.lint]
ignore = [
  "B023",    # make_str closure in ensemble.py
  "PLR0124", # `s == s` as NaN check
  "PLR0402", # `import torch.nn as nn`
  "SIM118",  # `in dict.keys()`
  "UP006",   # typing.Dict / List / Tuple
  "UP035",
  "UP045",   # Optional[X]
]

[tool.ty.rules]
invalid-mutable-override = "ignore" # nn.Module subclasses overriding `forward`
